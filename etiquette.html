<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Vision · Étiquette</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream:#f6f1e6; --paper:#fffdf8; --ink:#0a0a0a; --slate:#5c6b83;
    --red-flag:#c8342f; --yellow-flag:#f2b632; --green-flag:#1e7a46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--cream); font-family:'Inter',system-ui,sans-serif; color:var(--ink);}
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}

  header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid #e0dbcb;}
  .flagbar{height:3px; background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .headrow{display:flex; align-items:center; gap:12px; padding:13px 18px;}
  .iconbtn{width:38px; height:38px; border-radius:10px; border:1px solid #e0dbcb; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#16305c; flex:none;}
  .iconbtn:hover{background:var(--cream);}
  .head-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px;}
  .head-sub{font-size:11.5px; color:#93a1b8;}

  main{max-width:420px; margin:0 auto; padding:22px 18px 60px;}

  /* -- Étiquette AWB monochrome -- */
  .label{background:#fff; border:2.5px solid var(--ink); border-radius:2px; overflow:hidden; box-shadow:0 20px 40px -20px rgba(4,10,25,.35); font-family:'Inter',system-ui,sans-serif;}
  .lbl-div{border-top:2px solid var(--ink);}

  .lbl-head{display:flex; justify-content:space-between; align-items:flex-start; padding:14px 16px;}
  .lbl-title{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:23px; line-height:1.15; text-transform:uppercase;}
  .mode-badge{border:1.5px solid var(--ink); border-radius:999px; padding:4px 12px; font-size:12px; font-weight:700; letter-spacing:.08em; white-space:nowrap;}

  .lbl-section{padding:12px 16px;}
  .lbl-caption{font-size:11.5px; font-weight:700; letter-spacing:.08em; color:var(--slate); margin-bottom:5px;}
  .lbl-name-lg{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:24px; text-transform:uppercase; line-height:1.15; margin-bottom:4px;}
  .lbl-city{font-size:15.5px; margin-bottom:4px;}
  .lbl-row-between{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:700; font-size:16.5px; text-transform:uppercase;}

  .lbl-qr-row{display:flex; align-items:center; gap:16px; padding:14px 16px;}
  .lbl-qr{width:110px; height:110px; flex:none; border:1px solid #e0dbcb;}
  .lbl-track-code{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:26px; letter-spacing:.04em;}

  .lbl-barcode-section{padding:14px 16px; text-align:center;}
  .lbl-barcode-section svg{max-width:100%; height:auto;}
  .lbl-track-code-sm{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; letter-spacing:.25em; margin-top:2px;}

  .lbl-sender-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:3px;}
  .lbl-sender-row strong{font-size:16.5px; font-weight:700; text-transform:uppercase;}
  .lbl-sender-row span{font-size:15.5px; font-weight:600;}

  .lbl-footer-grid{display:grid; grid-template-columns:1fr 1fr 1fr;}
  .fg-col{padding:10px 12px; text-align:center;}
  .fg-col:not(:last-child){border-right:2px solid var(--ink);}
  .fg-val{font-weight:800; font-size:16.5px;}

  .lbl-ref-row{display:flex; justify-content:space-between; align-items:baseline; padding:10px 16px; font-size:14.5px;}
  .lbl-ref-row strong{font-weight:800; text-transform:uppercase; letter-spacing:.03em;}

  .lbl-legal{padding:12px 16px; font-size:11.5px; color:var(--slate); line-height:1.5;}

  .lbl-domain{text-align:center; padding:10px 16px; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.15em;}

  .actions-bar{display:flex; gap:10px; margin-top:18px;}
  .btn{border:none; border-radius:11px; padding:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; flex:1; display:flex; align-items:center; justify-content:center; gap:7px;}
  .btn-primary{background:linear-gradient(160deg, #1e3f78, #0f2142); color:#fff;}

  .loading-state, .error-state{text-align:center; padding:60px 20px; color:var(--slate);}

  @media print{
    header, .actions-bar{display:none !important;}
    body{background:#fff;}
    main{padding:0; max-width:100%;}
    .label{box-shadow:none;}
  }
</style>
</head>
<body>

<header>
  <div class="flagbar"></div>
  <div class="headrow">
    <a class="iconbtn" href="colis.html" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div>
      <div class="head-title">Étiquette d'expédition</div>
      <div class="head-sub">Format AWB — à imprimer et coller sur le colis</div>
    </div>
  </div>
</header>

<main id="mainContent">
  <div class="loading-state" id="loadingState">Chargement de l'étiquette…</div>
</main>

<script>
  // ============================================================
  // CONFIGURATION FIREBASE — mêmes clés que sur les autres pages
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDoWCBh3rschFm97Z5Y7ax1bamhadDS42Q",
    authDomain: "africa-vision-3b38f.firebaseapp.com",
    projectId: "africa-vision-3b38f",
    storageBucket: "africa-vision-3b38f.firebasestorage.app",
    messagingSenderId: "233363053035",
    appId: "1:233363053035:web:6a5ef497fbf0991216e1ae"
  };
  const REQUIRE_AUTH = true;
  const LOGIN_URL = "index.html";

  // Coordonnées de support affichées sur l'étiquette — adapte si besoin
  const SUPPORT_EMAIL = "africavisionvoyage@gmail.com";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const colisId = new URLSearchParams(window.location.search).get('id');

  auth.onAuthStateChanged(user => {
    if(user){ init(); }
    else if(REQUIRE_AUTH){ window.location.href = LOGIN_URL; }
    else { init(); }
  });

  async function init(){
    if(!colisId){
      document.getElementById('mainContent').innerHTML = '<div class="error-state">Aucun colis spécifié.</div>';
      return;
    }
    try{
      const doc = await db.collection('colis').doc(colisId).get();
      if(!doc.exists){
        document.getElementById('mainContent').innerHTML = '<div class="error-state">Ce colis est introuvable.</div>';
        return;
      }
      render(doc.data());
    }catch(err){
      console.error(err);
      document.getElementById('mainContent').innerHTML = '<div class="error-state">Impossible de charger l\u2019étiquette. Vérifie la configuration Firebase.</div>';
    }
  }

  function fmtDate(ts){
    const d = ts && ts.toDate ? ts.toDate() : new Date();
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  }

  function render(c){
    const dest = c.destinataire || {};
    const exp = c.expediteur || {};
    const route = c.route || {};
    const numeroSuivi = c.numeroSuivi || colisId;
    const nbArticles = (c.produits||[]).reduce((s,p) => s + (Number(p.quantite)||0), 0) || 1;
    const modeLabel = "AÉRIEN"; // valeur par défaut ; ajuste manuellement si l'envoi est maritime
    // Lien vers la page publique de suivi de colis — adapte si l'adresse change un jour
    const TRACKING_BASE_URL = "https://souldtbah84-dotcom.github.io/Afrique-Vision-Suivi/";
    const trackingLink = TRACKING_BASE_URL + "?num=" + encodeURIComponent(numeroSuivi);
    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=" + encodeURIComponent(trackingLink);

    document.getElementById('mainContent').innerHTML = `
      <div class="label" id="labelCard">
        <div class="lbl-head">
          <div class="lbl-title">Africa Vision<br>Multiservices</div>
          <div class="mode-badge">${modeLabel}</div>
        </div>

        <div class="lbl-div lbl-section">
          <div class="lbl-caption">DESTINATAIRE / TO</div>
          <div class="lbl-name-lg">${[dest.prenom, dest.nom].filter(Boolean).join(' ')||'—'}</div>
          <div class="lbl-city">${(dest.adresse||'').split(',')[0] || ''}</div>
          <div class="lbl-row-between"><span>${route.arrivee||''}</span><span>${dest.telephone||''}</span></div>
        </div>

        <div class="lbl-div lbl-qr-row">
          <img class="lbl-qr" src="${qrUrl}" alt="QR code de suivi">
          <div>
            <div class="lbl-caption">CODE DE SUIVI</div>
            <div class="lbl-track-code">${numeroSuivi}</div>
          </div>
        </div>

        <div class="lbl-div lbl-section">
          <div class="lbl-caption">EXPÉDITEUR / FROM</div>
          <div class="lbl-sender-row"><strong>${[exp.prenom, exp.nom].filter(Boolean).join(' ')||'—'}</strong><span>${exp.telephone||''}</span></div>
          <div class="lbl-city">${(exp.adresse||'CONAKRY')}</div>
        </div>

        <div class="lbl-div lbl-footer-grid">
          <div class="fg-col"><div class="lbl-caption">POIDS</div><div class="fg-val">${(c.poidsTotal||0).toFixed(2)} kg</div></div>
          <div class="fg-col"><div class="lbl-caption">ARTICLES</div><div class="fg-val">${nbArticles}</div></div>
          <div class="fg-col"><div class="lbl-caption">DATE</div><div class="fg-val">${fmtDate(c.dateCreation)}</div></div>
        </div>

        <div class="lbl-div lbl-ref-row">
          <span class="lbl-caption" style="margin:0;">RÉF.</span>
          <strong>${route.depart||'GUINEE'} → ${route.arrivee||''}</strong>
        </div>

        <div class="lbl-div lbl-legal">
          Vérifier l'état du colis avant acceptation et émettre toute réserve en présence du livreur.
          Transport soumis aux conditions générales d'Africa Vision Multiservices.
          Support : ${SUPPORT_EMAIL}
        </div>

        <div class="lbl-div lbl-domain">AFRICA VISION MULTISERVICES</div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-primary" id="printBtn">🖨️ Imprimer / Télécharger (PDF)</button>
      </div>
    `;

    document.getElementById('printBtn').addEventListener('click', () => window.print());
  }
</script>

</body>
</html>
