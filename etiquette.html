<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Vision · Étiquette</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-950:#0a1830; --navy-900:#0f2142; --navy-800:#16305c; --navy-700:#1e3f78;
    --cream:#f6f1e6; --paper:#fffdf8; --gold:#c99a3c; --gold-light:#e6c876;
    --ink:#0f1b2d; --slate:#5c6b83; --slate-light:#93a1b8; --line:#e0dbcb;
    --red-flag:#c8342f; --yellow-flag:#f2b632; --green-flag:#1e7a46; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--cream); font-family:'Inter',system-ui,sans-serif; color:var(--ink);}
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}

  header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .flagbar{height:3px; background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .headrow{display:flex; align-items:center; gap:12px; padding:13px 18px;}
  .iconbtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy-800); flex:none;}
  .iconbtn:hover{background:var(--cream);}
  .head-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px;}
  .head-sub{font-size:11.5px; color:var(--slate-light);}

  main{max-width:460px; margin:0 auto; padding:22px 18px 60px;}

  /* -- L'étiquette elle-même, format proche d'une étiquette colis 100x150mm -- */
  .label{
    background:#fff; border:2.5px solid var(--navy-950); border-radius:10px;
    padding:18px; box-shadow:0 20px 40px -20px rgba(4,10,25,.35);
  }
  .lbl-topline{display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--navy-950); padding-bottom:10px; margin-bottom:12px;}
  .lbl-brand{display:flex; align-items:center; gap:8px;}
  .lbl-mark{width:28px; height:28px; border-radius:7px; background:linear-gradient(145deg, var(--gold-light), var(--gold)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:11px; color:var(--navy-950); flex:none;}
  .lbl-brand-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;}
  .lbl-mode{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px; background:var(--cream); color:var(--navy-800); text-transform:uppercase; letter-spacing:.04em;}

  .lbl-section{margin-bottom:12px;}
  .lbl-section .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate-light); margin-bottom:3px; font-weight:700;}
  .lbl-from{font-size:11px; color:var(--slate); margin-bottom:14px; line-height:1.4;}

  .lbl-to-box{border:1.5px dashed var(--navy-800); border-radius:8px; padding:12px; margin-bottom:14px;}
  .lbl-to-name{font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:19px; line-height:1.2; margin-bottom:6px;}
  .lbl-to-line{font-size:13px; color:var(--ink); margin-bottom:2px; font-weight:500;}
  .lbl-to-line.addr{font-weight:700;}

  .lbl-route{
    display:flex; align-items:center; justify-content:center; gap:10px; background:var(--navy-950); color:#fff;
    border-radius:8px; padding:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-bottom:14px;
  }

  .lbl-meta{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .lbl-meta-box{background:var(--cream); border-radius:7px; padding:8px 10px;}
  .lbl-meta-box .l{font-size:9px; text-transform:uppercase; color:var(--slate-light); font-weight:700; margin-bottom:2px;}
  .lbl-meta-box .v{font-weight:700; font-size:13px;}

  .lbl-barcode-box{text-align:center; padding-top:8px; border-top:2px solid var(--navy-950);}
  .lbl-barcode-box svg{max-width:100%; height:auto;}
  .lbl-track-text{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:800; letter-spacing:.06em; margin-top:2px;}

  .actions-bar{display:flex; gap:10px; margin-top:18px;}
  .btn{border:none; border-radius:11px; padding:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; flex:1; display:flex; align-items:center; justify-content:center; gap:7px;}
  .btn-primary{background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff;}

  .loading-state, .error-state{text-align:center; padding:60px 20px; color:var(--slate);}

  @media print{
    header, .actions-bar{display:none !important;}
    body{background:#fff;}
    main{padding:0; max-width:100%;}
    .label{box-shadow:none;}
  }
</style>
</head>
<body>

<header>
  <div class="flagbar"></div>
  <div class="headrow">
    <a class="iconbtn" href="colis.html" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div>
      <div class="head-title">Étiquette d'expédition</div>
      <div class="head-sub">À coller sur le colis</div>
    </div>
  </div>
</header>

<main id="mainContent">
  <div class="loading-state" id="loadingState">Chargement de l'étiquette…</div>
</main>

<script>
  // ============================================================
  // CONFIGURATION FIREBASE — mêmes clés que sur les autres pages
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDoWCBh3rschFm97Z5Y7ax1bamhadDS42Q",
    authDomain: "africa-vision-3b38f.firebaseapp.com",
    projectId: "africa-vision-3b38f",
    storageBucket: "africa-vision-3b38f.firebasestorage.app",
    messagingSenderId: "233363053035",
    appId: "1:233363053035:web:6a5ef497fbf0991216e1ae"
  };
  const REQUIRE_AUTH = true;
  const LOGIN_URL = "index.html";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const colisId = new URLSearchParams(window.location.search).get('id');

  auth.onAuthStateChanged(user => {
    if(user){ init(); }
    else if(REQUIRE_AUTH){ window.location.href = LOGIN_URL; }
    else { init(); }
  });

  async function init(){
    if(!colisId){
      document.getElementById('mainContent').innerHTML = '<div class="error-state">Aucun colis spécifié.</div>';
      return;
    }
    try{
      const doc = await db.collection('colis').doc(colisId).get();
      if(!doc.exists){
        document.getElementById('mainContent').innerHTML = '<div class="error-state">Ce colis est introuvable.</div>';
        return;
      }
      render(doc.data());
    }catch(err){
      console.error(err);
      document.getElementById('mainContent').innerHTML = '<div class="error-state">Impossible de charger l\u2019étiquette. Vérifie la configuration Firebase.</div>';
    }
  }

  function render(c){
    const dest = c.destinataire || {};
    const route = c.route || {};
    const numeroSuivi = c.numeroSuivi || colisId;
    const isMaritime = (c.bordereauId ? true : false); // simple indication si déjà affecté à un envoi

    document.getElementById('mainContent').innerHTML = `
      <div class="label" id="labelCard">
        <div class="lbl-topline">
          <div class="lbl-brand">
            <div class="lbl-mark">AV</div>
            <div class="lbl-brand-name">Africa Vision</div>
          </div>
          <div class="lbl-mode">Colis</div>
        </div>

        <div class="lbl-section">
          <div class="l">Expéditeur</div>
          <div class="lbl-from">Africa Vision Multiservices — Conakry, Guinée</div>
        </div>

        <div class="lbl-to-box">
          <div class="l" style="margin-bottom:6px;">Destinataire</div>
          <div class="lbl-to-name">${[dest.prenom, dest.nom].filter(Boolean).join(' ')||'—'}</div>
          <div class="lbl-to-line addr">${dest.adresse || 'Adresse non renseignée'}</div>
          <div class="lbl-to-line">${dest.telephone||''}</div>
        </div>

        <div class="lbl-route">🇬🇳 ${route.depart||'GUINEE'} → ${route.arrivee||'—'}</div>

        <div class="lbl-meta">
          <div class="lbl-meta-box"><div class="l">Poids</div><div class="v">${(c.poidsTotal||0).toFixed(1)} kg</div></div>
          <div class="lbl-meta-box"><div class="l">Date</div><div class="v">${new Date().toLocaleDateString('fr-FR')}</div></div>
        </div>

        <div class="lbl-barcode-box">
          <svg id="barcode"></svg>
          <div class="lbl-track-text">${numeroSuivi}</div>
        </div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-primary" id="printBtn">🖨️ Imprimer / Télécharger (PDF)</button>
      </div>
    `;

    try{
      JsBarcode("#barcode", numeroSuivi, {
        format:"CODE128", width:2.2, height:52, displayValue:false, margin:0, background:"#ffffff", lineColor:"#0a1830"
      });
    }catch(err){
      console.warn("Code-barres indisponible :", err);
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print());
  }
</script>

</body>
</html>
