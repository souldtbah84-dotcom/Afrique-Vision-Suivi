<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Vision · Facture Commerciale</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-950:#0a1830; --navy-900:#0f2142; --navy-800:#16305c; --navy-700:#1e3f78;
    --cream:#f6f1e6; --paper:#fffdf8; --gold:#c99a3c; --gold-light:#e6c876;
    --ink:#0f1b2d; --slate:#5c6b83; --slate-light:#93a1b8; --line:#e7e1d2;
    --red-flag:#c8342f; --yellow-flag:#f2b632; --green-flag:#1e7a46; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--cream); font-family:'Inter',system-ui,sans-serif; color:var(--ink);}
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}

  header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .flagbar{height:3px; background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .headrow{display:flex; align-items:center; gap:12px; padding:13px 18px;}
  .iconbtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy-800); flex:none;}
  .iconbtn:hover{background:var(--cream);}
  .head-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px;}
  .head-sub{font-size:11.5px; color:var(--slate-light);}

  main{max-width:640px; margin:0 auto; padding:22px 18px 60px;}

  .invoice{background:var(--paper); border-radius:var(--radius); padding:0; box-shadow:0 20px 40px -20px rgba(4,10,25,.35); overflow:hidden;}
  .inv-head{padding:26px 26px 20px; border-bottom:3px solid var(--navy-900); display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .inv-brand{display:flex; align-items:center; gap:11px;}
  .inv-mark{width:42px; height:42px; border-radius:11px; background:linear-gradient(145deg, var(--gold-light), var(--gold)); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--navy-950); flex:none;}
  .inv-brand-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
  .inv-brand-sub{font-size:11px; color:var(--slate-light);}
  .inv-title-block{text-align:right;}
  .inv-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--navy-900); letter-spacing:.03em;}
  .inv-num{font-size:12.5px; color:var(--gold); font-weight:700; margin-top:3px;}
  .inv-date{font-size:11.5px; color:var(--slate-light); margin-top:2px;}

  .inv-body{padding:22px 26px;}
  .inv-two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px;}
  .inv-party h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate-light); margin:0 0 8px;}
  .inv-party .name{font-weight:700; font-size:14px; margin-bottom:3px;}
  .inv-party .line{font-size:12.5px; color:var(--slate); margin-bottom:2px;}

  table{width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12.5px;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate-light); padding:8px 6px; border-bottom:2px solid var(--line);}
  thead th.num{text-align:right;}
  tbody td{padding:9px 6px; border-bottom:1px solid var(--line);}
  tbody td.num{text-align:right; font-weight:600;}

  .inv-totals{margin-left:auto; width:220px;}
  .inv-totals .row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px;}
  .inv-totals .row.grand{border-top:2px solid var(--navy-900); margin-top:6px; padding-top:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;}

  .inv-note{background:var(--cream); border-radius:10px; padding:12px 14px; font-size:11.5px; color:var(--slate); margin-top:20px; line-height:1.5;}

  .inv-sign{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:36px;}
  .inv-sign .box{text-align:center;}
  .inv-sign .line{border-top:1px solid var(--slate-light); margin-top:44px; padding-top:6px; font-size:11px; color:var(--slate-light);}

  .actions-bar{display:flex; gap:10px; margin-top:18px;}
  .btn{border:none; border-radius:11px; padding:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; flex:1; display:flex; align-items:center; justify-content:center; gap:7px;}
  .btn-primary{background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff;}
  .btn-wa{background:#25D366; color:#fff;}

  .loading-state, .error-state{text-align:center; padding:60px 20px; color:var(--slate);}

  @media print{
    header, .actions-bar{display:none !important;}
    body{background:#fff;}
    main{padding:0; max-width:100%;}
    .invoice{box-shadow:none; border:1px solid #ddd;}
  }
</style>
</head>
<body>

<header>
  <div class="flagbar"></div>
  <div class="headrow">
    <a class="iconbtn" href="factures.html" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div>
      <div class="head-title">Facture Commerciale</div>
      <div class="head-sub">Document à usage douanier</div>
    </div>
  </div>
</header>

<main id="mainContent">
  <div class="loading-state" id="loadingState">Chargement de la facture…</div>
</main>

<script>
  // ============================================================
  // CONFIGURATION FIREBASE — mêmes clés que sur les autres pages
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDoWCBh3rschFm97Z5Y7ax1bamhadDS42Q",
    authDomain: "africa-vision-3b38f.firebaseapp.com",
    projectId: "africa-vision-3b38f",
    storageBucket: "africa-vision-3b38f.firebasestorage.app",
    messagingSenderId: "233363053035",
    appId: "1:233363053035:web:6a5ef497fbf0991216e1ae"
  };
  const REQUIRE_AUTH = true;
  const LOGIN_URL = "index.html";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const fmtGNF = n => new Intl.NumberFormat('fr-FR').format(Math.round(n||0)) + " GNF";
  const fmtDate = ts => { if(!ts) return new Date().toLocaleDateString('fr-FR'); const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('fr-FR'); };

  const colisId = new URLSearchParams(window.location.search).get('id');

  auth.onAuthStateChanged(user => {
    if(user){ init(); }
    else if(REQUIRE_AUTH){ window.location.href = LOGIN_URL; }
    else { init(); }
  });

  function genFactureNumber(){
    const year = new Date().getFullYear();
    const num = Math.floor(1000 + Math.random()*9000);
    return "FACT-" + year + "-" + num;
  }

  async function init(){
    if(!colisId){
      document.getElementById('mainContent').innerHTML = '<div class="error-state">Aucun colis spécifié.</div>';
      return;
    }
    try{
      const ref = db.collection('colis').doc(colisId);
      const doc = await ref.get();
      if(!doc.exists){
        document.getElementById('mainContent').innerHTML = '<div class="error-state">Ce colis est introuvable.</div>';
        return;
      }
      let data = doc.data();

      // Génère le numéro de facture une seule fois (idempotent) et le fige.
      if(!data.numeroFacture){
        const numeroFacture = genFactureNumber();
        await ref.update({
          numeroFacture,
          dateEmissionFacture: firebase.firestore.FieldValue.serverTimestamp()
        });
        data.numeroFacture = numeroFacture;
        data.dateEmissionFacture = null; // affichera la date du jour via fmtDate(null)
      }

      render(data);
    }catch(err){
      console.error(err);
      document.getElementById('mainContent').innerHTML = '<div class="error-state">Impossible de charger la facture. Vérifie la configuration Firebase.</div>';
    }
  }

  function render(c){
    const exp = c.expediteur || {};
    const dest = c.destinataire || {};
    const route = c.route || {};
    const produits = c.produits || [];

    document.getElementById('mainContent').innerHTML = `
      <div class="invoice">
        <div class="inv-head">
          <div class="inv-brand">
            <div class="inv-mark">AV</div>
            <div><div class="inv-brand-name">Africa Vision Multiservices</div><div class="inv-brand-sub">Conakry, Guinée</div></div>
          </div>
          <div class="inv-title-block">
            <div class="inv-title">FACTURE COMMERCIALE</div>
            <div class="inv-num">${c.numeroFacture}</div>
            <div class="inv-date">${fmtDate(c.dateEmissionFacture)}</div>
          </div>
        </div>

        <div class="inv-body">
          <div class="inv-two-col">
            <div class="inv-party">
              <h4>Exportateur / Expéditeur</h4>
              <div class="name">${[exp.prenom, exp.nom].filter(Boolean).join(' ')||'—'}</div>
              <div class="line">${exp.telephone||''}</div>
              <div class="line">${exp.adresse||''}</div>
              <div class="line">${route.depart||'GUINEE'}</div>
            </div>
            <div class="inv-party">
              <h4>Destinataire / Importateur</h4>
              <div class="name">${[dest.prenom, dest.nom].filter(Boolean).join(' ')||'—'}</div>
              <div class="line">${dest.telephone||''}</div>
              <div class="line">${dest.adresse||''}</div>
              <div class="line">${route.arrivee||''}</div>
            </div>
          </div>

          <div class="line" style="font-size:12px; color:var(--slate); margin-bottom:14px;">Numéro de suivi : <strong>${c.numeroSuivi||''}</strong></div>

          <table>
            <thead>
              <tr><th>Description</th><th class="num">Qté</th><th class="num">Poids (kg)</th><th class="num">Val. unit.</th><th class="num">Val. totale</th></tr>
            </thead>
            <tbody>
              ${produits.map(p => `
                <tr>
                  <td>${p.nom}</td>
                  <td class="num">${p.quantite}</td>
                  <td class="num">${(p.quantite*p.poidsUnitaire).toFixed(1)}</td>
                  <td class="num">${fmtGNF(p.valeurUnitaire)}</td>
                  <td class="num">${fmtGNF(p.quantite*p.valeurUnitaire)}</td>
                </tr>`).join('')}
            </tbody>
          </table>

          <div class="inv-totals">
            <div class="row"><span>Poids total</span><span>${(c.poidsTotal||0).toFixed(1)} kg</span></div>
            <div class="row grand"><span>Valeur déclarée</span><span>${fmtGNF(c.valeurTotal)}</span></div>
          </div>

          <div class="inv-note">
            Les marchandises décrites ci-dessus sont expédiées par Africa Vision Multiservices. La valeur déclarée l'est à des fins douanières uniquement et reflète la valeur estimée des biens au moment de l'expédition.
          </div>

          <div class="inv-sign">
            <div class="box"><div class="line">Signature de l'expéditeur</div></div>
            <div class="box"><div class="line">Cachet Africa Vision Multiservices</div></div>
          </div>
        </div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-primary" id="printBtn">🖨️ Imprimer / PDF</button>
        <button class="btn btn-wa" id="waBtn">📤 WhatsApp</button>
      </div>
    `;

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('waBtn').addEventListener('click', () => {
      const msg = `Facture Commerciale Africa Vision\nN° ${c.numeroFacture}\nColis : ${c.numeroSuivi||''}\nDestinataire : ${[dest.prenom,dest.nom].filter(Boolean).join(' ')}\nValeur déclarée : ${fmtGNF(c.valeurTotal)}`;
      window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
    });
  }
</script>

</body>
</html>
