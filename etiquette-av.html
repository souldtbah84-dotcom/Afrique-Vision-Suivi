<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-950:#0a1830; --navy-900:#0f2142; --navy-800:#16305c; --navy-700:#1e3f78;
    --cream:#f6f1e6; --paper:#fffdf8; --gold:#c99a3c; --gold-light:#e6c876;
    --ink:#0f1b2d; --slate:#5c6b83; --slate-light:#93a1b8; --line:#e7e1d2;
    --red-flag:#c8342f; --yellow-flag:#f2b632; --green-flag:#1e7a46;
    --error-bg:#fdecec; --error-text:#a32621; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--cream); font-family:'Inter',system-ui,sans-serif; color:var(--ink);}

  header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .flagbar{height:3px; background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .head-inner{max-width:960px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px;}
  .iconbtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy-800); flex:none; text-decoration:none;}
  .iconbtn:hover{background:var(--cream);}
  .head-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--navy-900);}
  .head-sub{font-size:12px; color:var(--slate);}

  main{max-width:960px; margin:0 auto; padding:20px 16px 110px;}
  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:18px;}
  .panel h3{margin:0 0 4px; font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--navy-900);}
  .panel .hint{font-size:12.5px; color:var(--slate); margin-bottom:16px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--navy-800); margin-bottom:6px;}
  .input-shell{display:flex; align-items:center; border:1.5px solid #e3ddcd; border-radius:10px; background:#fff;}
  input, select{width:100%; border:none; outline:none; background:transparent; padding:11px; font-size:14px; font-family:inherit; color:var(--ink);}

  .preview-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
  .preview-head h3{margin:0; font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--navy-900);}
  .preview-head span{font-size:12px; color:var(--slate);}
  .preview-wrap{background:#e9e3d4; border-radius:var(--radius); padding:18px; overflow-x:auto;}

  .actions{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--paper); border-top:1px solid var(--line);}
  .actions-inner{max-width:960px; margin:0 auto; padding:12px 16px; display:flex; gap:10px;}
  .btn{flex:1; border:none; border-radius:12px; padding:14px; font-size:14.5px; font-weight:600; font-family:inherit; cursor:pointer;}
  .btn-primary{background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff;}
  .btn-gold{background:linear-gradient(160deg, var(--gold), #a97f27); color:#fff;}
  .btn:disabled{opacity:.6; cursor:default;}
  .alert{display:none; background:var(--error-bg); color:var(--error-text); border:1px solid #f3c6c4;
         border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px;}

  /* ---------- Planche d'étiquettes ---------- */
  .sheet{background:#fff; margin:0 auto 18px; box-shadow:0 10px 30px -12px rgba(4,10,25,.4);
         width:210mm; height:297mm; padding:8mm; display:grid; gap:4mm;}
  .sheet.per1{grid-template-columns:1fr; grid-template-rows:1fr;}
  .sheet.per2{grid-template-columns:1fr; grid-template-rows:1fr 1fr;}
  .sheet.per4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}

  .label{border:2px dashed #b0a894; border-radius:4mm; padding:6mm; background:#fff;
         display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden;}
  .lbl-flag{width:100%; height:2.5mm; border-radius:1mm; flex:none;
            background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .lbl-logo{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; padding:4mm 0;}
  .lbl-logo img{max-width:100%; max-height:100%; object-fit:contain;}

  .lbl-band{width:100%; flex:none; background:var(--navy-900); color:#fff; border-radius:2.5mm; padding:2.8mm 3mm;
            font-weight:700; letter-spacing:.6px; text-transform:uppercase; font-size:3.4mm; line-height:1.35;}

  .lbl-contact{width:100%; flex:none; padding-top:3.5mm;}
  .tels{display:flex; justify-content:center; gap:6mm; flex-wrap:wrap;}
  .tel{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:6.5mm; color:var(--navy-900); white-space:nowrap;}
  .mails{margin-top:2.5mm; font-size:3.4mm; color:var(--ink); line-height:1.6;}
  .city{margin-top:2.5mm; font-size:3.2mm; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--gold);}

  /* Compactage pour 4 étiquettes par page */
  .sheet.per4 .label{padding:4mm;}
  .sheet.per4 .lbl-band{font-size:2.5mm; padding:2mm; letter-spacing:.3px;}
  .sheet.per4 .tels{gap:3mm;}
  .sheet.per4 .tel{font-size:4.4mm;}
  .sheet.per4 .mails{font-size:2.6mm; margin-top:2mm;}
  .sheet.per4 .city{font-size:2.5mm; margin-top:1.8mm;}

  @page{size:A4; margin:0;}
  @media print{
    body{background:#fff;}
    header, main > .panel, .preview-head, .actions, .alert{display:none !important;}
    main{padding:0; max-width:none;}
    .preview-wrap{background:#fff; padding:0; overflow:visible;}
    .sheet{box-shadow:none; margin:0; page-break-after:always;}
    .sheet:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="flagbar"></div>
  <div class="head-inner">
    <a class="iconbtn" href="dashboard.html" aria-label="Retour">←</a>
    <div>
      <div class="head-title">Étiquettes colis</div>
      <div class="head-sub">À coller après regroupage pour identifier nos colis</div>
    </div>
  </div>
</header>

<main>
  <div class="alert" id="alertBox"></div>

  <div class="panel">
    <h3>Format d'impression</h3>
    <div class="hint">Une grande étiquette pour les gros cartons, quatre petites pour les sacs et petits colis.</div>
    <div class="grid">
      <div class="field">
        <label>Étiquettes par page A4</label>
        <div class="input-shell"><select id="fPer">
          <option value="1">1 grande (A4 entier)</option>
          <option value="2" selected>2 moyennes (A5)</option>
          <option value="4">4 petites (A6)</option>
        </select></div>
      </div>
      <div class="field">
        <label>Nombre de pages</label>
        <div class="input-shell"><input type="number" id="fPages" min="1" max="20" value="1"></div>
      </div>
    </div>
  </div>

  <div class="preview-head">
    <h3>Aperçu</h3>
    <span id="previewInfo"></span>
  </div>
  <div class="preview-wrap" id="previewWrap"></div>
</main>

<div class="actions">
  <div class="actions-inner">
    <button class="btn btn-primary" id="printBtn">🖨️ Imprimer</button>
    <button class="btn btn-gold" id="pngBtn">⬇️ Télécharger PNG</button>
  </div>
</div>

  const TEL_1  = "+224 625 81 36 46";
  const TEL_2  = "+224 612 39 83 18";
  const MAIL_1 = "africavisionvoyage@gmail.com";
  const MAIL_2 = "africavisioncargo@gmail.com";

  function labelHTML(){
    return `<div class="label">
      <div class="lbl-flag"></div>
      <div class="lbl-logo"><img src="${LOGO}" alt="Africa Vision Multiservices"></div>
      <div class="lbl-band">Colis appartenant à Africa Vision Multiservices</div>
      <div class="lbl-contact">
        <div class="tels">
          <span class="tel">${TEL_1}</span>
          <span class="tel">${TEL_2}</span>
        </div>
        <div class="mails">${MAIL_1}<br>${MAIL_2}</div>
        <div class="city">Conakry — Guinée</div>
      </div>
    </div>`;
  }

  function render(){
    const per = Number($('fPer').value);
    const pages = Math.min(20, Math.max(1, Number($('fPages').value)||1));
    const one = labelHTML();
    let html = '';
    for(let p=0; p<pages; p++){
      html += `<div class="sheet per${per}">${one.repeat(per)}</div>`;
    }
    $('previewWrap').innerHTML = html;
    $('previewInfo').textContent = (per*pages) + " étiquette(s) · " + pages + " page(s) A4";
  }

  $('fPer').addEventListener('change', render);
  $('fPages').addEventListener('input', render);

  $('printBtn').addEventListener('click', () => window.print());

  $('pngBtn').addEventListener('click', async () => {
    const sheet = $('previewWrap').querySelector('.sheet');
    if(!sheet) return;
    if(typeof html2canvas === 'undefined'){
      showAlert("Le téléchargement PNG demande une connexion. Utilise Imprimer, puis « Enregistrer en PDF ».");
      return;
    }
    const btn = $('pngBtn'), label = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳ Préparation...';
    try{
      const canvas = await html2canvas(sheet, {scale:2, backgroundColor:'#ffffff'});
      const a = document.createElement('a');
      a.download = 'etiquette-africa-vision.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }catch(err){
      console.error(err);
      showAlert("Le PNG n'a pas pu être créé. Utilise Imprimer, puis « Enregistrer en PDF ».");
    }finally{
      btn.disabled = false; btn.textContent = label;
    }
  });

  render();
</script>
