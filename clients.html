<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Vision · Clients</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#0f2142">
<link rel="apple-touch-icon" href="icon-192-interne.png">
<link rel="icon" href="icon-192-interne.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-950:#0a1830; --navy-900:#0f2142; --navy-800:#16305c; --navy-700:#1e3f78;
    --cream:#f6f1e6; --paper:#fffdf8; --gold:#c99a3c; --gold-light:#e6c876;
    --ink:#0f1b2d; --slate:#5c6b83; --slate-light:#93a1b8; --line:#e7e1d2;
    --red-flag:#c8342f; --yellow-flag:#f2b632; --green-flag:#1e7a46; --blue-status:#2b5fb0;
    --error-bg:#fdecec; --error-text:#a32621; --radius:16px;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  html,body{margin:0; background:var(--cream); font-family:'Inter',system-ui,sans-serif; color:var(--ink);}
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}

  header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .flagbar{height:3px; background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .headrow{display:flex; align-items:center; gap:12px; padding:13px 18px;}
  .iconbtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy-800); flex:none;}
  .iconbtn:hover{background:var(--cream);}
  .head-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px;}
  .head-sub{font-size:11.5px; color:var(--slate-light);}
  .head-cta{
    margin-left:auto; background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff;
    border:none; border-radius:10px; padding:9px 13px; font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer;
  }

  main{max-width:680px; margin:0 auto; padding:18px 18px 50px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
  .kpi{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 12px 12px 15px; overflow:hidden;}
  .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px;}
  .kpi.total::before{background:var(--navy-800);}
  .kpi.actifs::before{background:var(--green-flag);}
  .kpi.nouveaux::before{background:var(--gold);}
  .kpi-label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); font-weight:600; margin-bottom:6px;}
  .kpi-value{font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700;}
  .kpi-value.skeleton{width:32px; height:19px; border-radius:6px; background:linear-gradient(90deg,#eee,#f6f6f6,#eee); background-size:200% 100%; animation:shimmer 1.3s infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  .search-shell{display:flex; align-items:center; gap:9px; background:var(--paper); border:1.5px solid var(--line); border-radius:11px; padding:0 13px; margin-bottom:16px;}
  .search-shell input{flex:1; border:none; outline:none; background:none; padding:12px 0; font-size:14px; font-family:inherit;}

  .list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .list-head h2{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0;}
  .list-head span{font-size:12.5px; color:var(--slate-light);}

  .client-list{display:flex; flex-direction:column; gap:10px;}
  .client-card{background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:14px 16px; display:flex; align-items:center; gap:13px; cursor:pointer;}
  .client-card:hover{border-color:var(--navy-700);}
  .client-avatar{width:42px; height:42px; border-radius:50%; background:var(--navy-900); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; font-family:'Space Grotesk',sans-serif; flex:none;}
  .client-info{flex:1; min-width:0;}
  .client-name{font-weight:700; font-size:14.5px;}
  .client-sub{font-size:12.5px; color:var(--slate-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .client-badge{flex:none; text-align:right;}
  .client-badge .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--navy-800);}
  .client-badge .l{font-size:10.5px; color:var(--slate-light); text-transform:uppercase; letter-spacing:.04em;}

  .empty-state, .error-state{text-align:center; padding:40px 20px; background:var(--paper); border:1px dashed var(--line); border-radius:14px; color:var(--slate);}
  .error-state{border-color:#f3c6c4; background:var(--error-bg); color:var(--error-text); border-style:solid;}
  .empty-state svg, .error-state svg{margin-bottom:10px; color:var(--slate-light);}

  /* MODAL (partagé détail + ajout) */
  .modal-overlay{position:fixed; inset:0; background:rgba(10,24,48,.5); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--paper); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); animation:slideUp .25s cubic-bezier(.2,.7,.2,1) both;}
  @media (min-width:600px){ .modal-overlay{align-items:center;} .modal{border-radius:18px; max-height:82vh;} }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; margin-bottom:16px; gap:12px;}
  .modal-head .client-avatar{width:44px; height:44px; font-size:15px;}
  .modal-head .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px;}
  .modal-close{margin-left:auto; background:var(--cream); border:none; width:32px; height:32px; border-radius:9px; cursor:pointer; color:var(--slate); display:flex; align-items:center; justify-content:center; flex:none;}
  .modal-section{margin-bottom:16px;}
  .modal-section h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--slate-light); margin:0 0 8px;}
  .modal-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .modal-line:last-child{border-bottom:none;}
  .modal-line span:first-child{color:var(--slate);}
  .hist-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-track{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--navy-800);}
  .hist-role{font-size:11px; color:var(--slate-light);}
  .status-pill{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px;}
  .status-pill.en_attente{background:#fdf2de; color:#a9780f;}
  .status-pill.en_transit{background:#e9f0fc; color:var(--blue-status);}
  .status-pill.livre{background:#e8f6ee; color:var(--green-flag);}

  .field{margin-bottom:14px;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:6px;}
  .input-shell{display:flex; align-items:center; border:1.5px solid #e3ddcd; border-radius:11px; background:#fff;}
  .input-shell:focus-within{border-color:var(--navy-700); box-shadow:0 0 0 3px rgba(30,63,120,.12);}
  input{width:100%; border:none; outline:none; background:transparent; padding:12px; font-size:14.5px; font-family:inherit; color:var(--ink);}
  .btn{border:none; border-radius:11px; padding:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer; width:100%; background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff;}
  .btn:disabled{opacity:.6;}
  .alert{display:none; background:var(--error-bg); color:var(--error-text); border:1px solid #f3c6c4; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px;}
  .alert.show{display:block;}

  .fab-hint{text-align:center; font-size:12px; color:var(--slate-light); margin:16px 0 0;}
</style>
</head>
<body>

<header>
  <div class="flagbar"></div>
  <div class="headrow">
    <a class="iconbtn" href="dashboard.html" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div>
      <div class="head-title">Clients</div>
      <div class="head-sub" id="headCount">Chargement…</div>
    </div>
    <button class="head-cta" id="addClientBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Nouveau
    </button>
    <button class="head-cta" id="deleteAllBtn" style="display:none; margin-left:8px; background:#fff; border:1.5px solid #f3c6c4; color:var(--red-flag);">
      🗑️ Tout supprimer
    </button>
  </div>
</header>

<main>

  <div class="kpi-grid">
    <div class="kpi total"><div class="kpi-label">Total clients</div><div class="kpi-value skeleton" id="kpiTotal"></div></div>
    <div class="kpi actifs"><div class="kpi-label">Actifs (30j)</div><div class="kpi-value skeleton" id="kpiActifs"></div></div>
    <div class="kpi nouveaux"><div class="kpi-label">Nouveaux ce mois</div><div class="kpi-value skeleton" id="kpiNouveaux"></div></div>
  </div>

  <div class="search-shell">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Rechercher par nom ou téléphone…">
  </div>

  <div class="list-head">
    <h2>Liste des clients</h2>
    <span id="visibleCount"></span>
  </div>

  <div class="client-list" id="clientList"></div>
  <p class="fab-hint">Les clients sont créés automatiquement à chaque nouveau colis, ou ajoutés manuellement ici.</p>

</main>

<!-- MODAL DETAIL -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="client-avatar" id="detailAvatar">··</div>
      <div class="name" id="detailName">—</div>
      <button class="modal-close" id="detailClose" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-section">
      <h4>Coordonnées</h4>
      <div id="detailContact"></div>
    </div>
    <div class="modal-section">
      <h4>Historique des colis</h4>
      <div id="detailHistory"></div>
    </div>
    <div class="modal-section">
      <button id="deleteClientBtn" style="width:100%; border:1.5px solid #f3c6c4; background:#fff; color:var(--red-flag); border-radius:11px; padding:12px; font-weight:600; font-size:13.5px; cursor:pointer;">🗑️ Supprimer ce client</button>
    </div>
  </div>
</div>

<!-- MODAL AJOUT -->
<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="name">Nouveau client</div>
      <button class="modal-close" id="addClose" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="alert" id="addAlert"></div>
    <div class="field"><label>Nom *</label><div class="input-shell"><input type="text" id="c_nom"></div></div>
    <div class="field"><label>Prénom *</label><div class="input-shell"><input type="text" id="c_prenom"></div></div>
    <div class="field"><label>Téléphone *</label><div class="input-shell"><input type="tel" id="c_tel" placeholder="Avec indicatif, ex : +224611830242"></div></div>
    <div class="field"><label>Email (optionnel)</label><div class="input-shell"><input type="email" id="c_email"></div></div>
    <div class="field"><label>Adresse (optionnel)</label><div class="input-shell"><input type="text" id="c_adresse"></div></div>
    <button class="btn" id="saveClientBtn">Ajouter le client</button>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURATION FIREBASE — mêmes clés que sur les autres pages
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDoWCBh3rschFm97Z5Y7ax1bamhadDS42Q",
    authDomain: "africa-vision-3b38f.firebaseapp.com",
    projectId: "africa-vision-3b38f",
    storageBucket: "africa-vision-3b38f.firebasestorage.app",
    messagingSenderId: "233363053035",
    appId: "1:233363053035:web:6a5ef497fbf0991216e1ae"
  };
  const REQUIRE_AUTH = true;
  const LOGIN_URL = "connexion.html";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const statusLabel = c => ({en_attente:'En attente', en_transit:'En transit', livre:'Livré'}[c] || c);
  const fmtDate = ts => { if(!ts) return '—'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('fr-FR'); };
  function initials(nom, prenom){
    const a = (prenom||'')[0] || ''; const b = (nom||'')[0] || '';
    return (a+b).toUpperCase() || '··';
  }
  function phoneKey(tel){ return (tel||'').replace(/[^0-9]/g,''); }

  let allClients = [];

  auth.onAuthStateChanged(async user => {
    if(user){
      loadClients();
      if(await isDga()) document.getElementById('deleteAllBtn').style.display = '';
    }
    else if(REQUIRE_AUTH){ window.location.href = LOGIN_URL; }
    else { loadClients(); }
  });

  function loadClients(){
    db.collection('clients').get().then(snap => {
      allClients = snap.docs.map(d => ({id:d.id, data:d.data()}));
      renderKPIs();
      applyFilter();
    }).catch(err => {
      console.error(err);
      document.getElementById('clientList').innerHTML = `
        <div class="error-state">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <p><strong>Impossible de charger les clients.</strong></p>
          <p>Vérifie la configuration Firebase et les règles Firestore.</p>
        </div>`;
      document.getElementById('headCount').textContent = "Erreur de chargement";
    });
  }

  function renderKPIs(){
    const now = Date.now();
    const THIRTY_D = 30*24*60*60*1000;
    const startOfMonth = new Date(); startOfMonth.setDate(1); startOfMonth.setHours(0,0,0,0);

    let actifs = 0, nouveaux = 0;
    allClients.forEach(({data}) => {
      const dernAct = data.derniereActivite && data.derniereActivite.toMillis ? data.derniereActivite.toMillis() : 0;
      if(now - dernAct <= THIRTY_D) actifs++;
      const created = data.dateCreation && data.dateCreation.toMillis ? data.dateCreation.toMillis() : 0;
      if(created >= startOfMonth.getTime()) nouveaux++;
    });

    document.getElementById('kpiTotal').textContent = allClients.length;
    document.getElementById('kpiActifs').textContent = actifs;
    document.getElementById('kpiNouveaux').textContent = nouveaux;
    document.querySelectorAll('.kpi-value').forEach(el => el.classList.remove('skeleton'));
    document.getElementById('headCount').textContent = allClients.length + " clients enregistrés";
  }

  function applyFilter(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    let list = allClients.filter(({data}) => {
      return !q ||
        (data.nom||'').toLowerCase().includes(q) ||
        (data.prenom||'').toLowerCase().includes(q) ||
        (data.telephone||'').toLowerCase().includes(q);
    });
    list.sort((a,b) => {
      const ta = a.data.derniereActivite && a.data.derniereActivite.toMillis ? a.data.derniereActivite.toMillis() : 0;
      const tb = b.data.derniereActivite && b.data.derniereActivite.toMillis ? b.data.derniereActivite.toMillis() : 0;
      return tb-ta;
    });
    renderList(list);
  }
  document.getElementById('searchInput').addEventListener('input', applyFilter);

  function renderList(list){
    const container = document.getElementById('clientList');
    document.getElementById('visibleCount').textContent = list.length + " affiché(s)";

    if(list.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 20c.7-3.4 3-5.3 5.5-5.3s4.8 1.9 5.5 5.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <p><strong>Aucun client trouvé.</strong></p>
        </div>`;
      return;
    }

    container.innerHTML = '';
    list.forEach(({id, data}) => {
      const total = (data.nbColisEnvoyes||0) + (data.nbColisRecus||0);
      const card = document.createElement('div');
      card.className = 'client-card';
      card.innerHTML = `
        <div class="client-avatar">${initials(data.nom, data.prenom)}</div>
        <div class="client-info">
          <div class="client-name">${[data.prenom, data.nom].filter(Boolean).join(' ') || 'Sans nom'}</div>
          <div class="client-sub">${data.telephone || ''} ${data.adresse ? '· '+data.adresse : ''}</div>
        </div>
        <div class="client-badge">
          <div class="n">${total}</div>
          <div class="l">colis</div>
        </div>
      `;
      card.addEventListener('click', () => openDetail(id, data));
      container.appendChild(card);
    });
  }

  // ---------------- DETAIL MODAL ----------------
  const detailOverlay = document.getElementById('detailOverlay');
  let currentDetailClientId = null;
  function openDetail(id, data){
    currentDetailClientId = id;
    document.getElementById('detailAvatar').textContent = initials(data.nom, data.prenom);
    document.getElementById('detailName').textContent = [data.prenom, data.nom].filter(Boolean).join(' ') || 'Sans nom';
    document.getElementById('detailContact').innerHTML = `
      <div class="modal-line"><span>Téléphone</span><span>${data.telephone || '—'}</span></div>
      <div class="modal-line"><span>Email</span><span>${data.email || '—'}</span></div>
      <div class="modal-line"><span>Adresse</span><span>${data.adresse || 'Non renseignée'}</span></div>
      <div class="modal-line"><span>Client depuis</span><span>${fmtDate(data.dateCreation)}</span></div>
      <div class="modal-line"><span>Colis envoyés / reçus</span><span>${data.nbColisEnvoyes||0} / ${data.nbColisRecus||0}</span></div>
    `;
    document.getElementById('detailHistory').innerHTML = '<p style="color:var(--slate-light); font-size:13px;">Chargement…</p>';
    detailOverlay.classList.add('show');
    loadHistory(data.telephone);
  }
  document.getElementById('detailClose').addEventListener('click', () => detailOverlay.classList.remove('show'));
  detailOverlay.addEventListener('click', e => { if(e.target === detailOverlay) detailOverlay.classList.remove('show'); });

  async function loadHistory(telephone){
    if(!telephone){ document.getElementById('detailHistory').innerHTML = '<p style="color:var(--slate-light); font-size:13px;">Aucun historique.</p>'; return; }
    try{
      const [asSender, asReceiver] = await Promise.all([
        db.collection('colis').where('expediteur.telephone', '==', telephone).get(),
        db.collection('colis').where('destinataire.telephone', '==', telephone).get()
      ]);
      const items = [];
      asSender.forEach(d => items.push({...d.data(), role:'Expéditeur'}));
      asReceiver.forEach(d => items.push({...d.data(), role:'Destinataire'}));
      items.sort((a,b) => {
        const ta = a.dateCreation && a.dateCreation.toMillis ? a.dateCreation.toMillis() : 0;
        const tb = b.dateCreation && b.dateCreation.toMillis ? b.dateCreation.toMillis() : 0;
        return tb-ta;
      });
      if(items.length === 0){
        document.getElementById('detailHistory').innerHTML = '<p style="color:var(--slate-light); font-size:13px;">Aucun colis pour ce client.</p>';
        return;
      }
      document.getElementById('detailHistory').innerHTML = items.map(c => `
        <div class="hist-item">
          <div><div class="hist-track">${c.numeroSuivi||'—'}</div><div class="hist-role">${c.role} · ${fmtDate(c.dateCreation)}</div></div>
          <span class="status-pill ${c.statut||'en_attente'}">${statusLabel(c.statut)}</span>
        </div>
      `).join('');
    }catch(err){
      console.error(err);
      document.getElementById('detailHistory').innerHTML = '<p style="color:var(--error-text); font-size:13px;">Impossible de charger l\u2019historique.</p>';
    }
  }

  // ---------------- AJOUT MANUEL ----------------
  const addOverlay = document.getElementById('addOverlay');
  document.getElementById('addClientBtn').addEventListener('click', () => {
    ['c_nom','c_prenom','c_tel','c_email','c_adresse'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('addAlert').classList.remove('show');
    addOverlay.classList.add('show');
  });
  document.getElementById('addClose').addEventListener('click', () => addOverlay.classList.remove('show'));
  addOverlay.addEventListener('click', e => { if(e.target === addOverlay) addOverlay.classList.remove('show'); });

  document.getElementById('saveClientBtn').addEventListener('click', async () => {
    const nom = document.getElementById('c_nom').value.trim();
    const prenom = document.getElementById('c_prenom').value.trim();
    const tel = document.getElementById('c_tel').value.trim();
    const email = document.getElementById('c_email').value.trim();
    const adresse = document.getElementById('c_adresse').value.trim();
    const alertBox = document.getElementById('addAlert');

    if(!nom || !prenom || !tel){
      alertBox.textContent = "Merci de renseigner au moins le nom, le prénom et le téléphone.";
      alertBox.classList.add('show');
      return;
    }
    const key = phoneKey(tel);
    if(!key){
      alertBox.textContent = "Le numéro de téléphone semble invalide.";
      alertBox.classList.add('show');
      return;
    }

    const btn = document.getElementById('saveClientBtn');
    btn.disabled = true; btn.textContent = "Ajout…";
    try{
      await db.collection('clients').doc(key).set({
        nom, prenom, telephone: tel, email, adresse,
        nbColisEnvoyes: 0, nbColisRecus: 0,
        dateCreation: firebase.firestore.FieldValue.serverTimestamp(),
        derniereActivite: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
      addOverlay.classList.remove('show');
      loadClients();
    }catch(err){
      console.error(err);
      alertBox.textContent = "Impossible d'ajouter le client. Vérifie les règles Firestore.";
      alertBox.classList.add('show');
    }finally{
      btn.disabled = false; btn.textContent = "Ajouter le client";
    }
  });

  // ---------------- SUPPRESSION D'UN CLIENT ----------------
  document.getElementById('deleteClientBtn').addEventListener('click', async () => {
    if(!currentDetailClientId) return;
    const client = allClients.find(c => c.id === currentDetailClientId);
    const name = client ? [client.data.prenom, client.data.nom].filter(Boolean).join(' ') : currentDetailClientId;
    if(!confirm("Supprimer le client " + name + " ?\n\nCette action est irréversible. Les colis déjà créés pour ce client ne sont PAS supprimés.")) return;

    const btn = document.getElementById('deleteClientBtn');
    btn.disabled = true; btn.textContent = "Suppression…";
    try{
      await db.collection('clients').doc(currentDetailClientId).delete();
      allClients = allClients.filter(c => c.id !== currentDetailClientId);
      renderKPIs();
      applyFilter();
      detailOverlay.classList.remove('show');
    }catch(err){
      console.error(err);
      alert("Impossible de supprimer ce client. Vérifie les règles Firestore.");
    }finally{
      btn.disabled = false; btn.textContent = "🗑️ Supprimer ce client";
    }
  });

  // ---------------- SUPPRESSION DE TOUS LES CLIENTS (réservé au DGA) ----------------
  async function isDga(){
    try{
      const snap = await db.collection('utilisateurs').where('email', '==', auth.currentUser.email).limit(1).get();
      if(snap.empty) return true; // compte non listé = DGA par défaut
      return snap.docs[0].data().role === 'dga';
    }catch(e){
      console.warn("Vérification DGA impossible", e);
      return false;
    }
  }

  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    if(allClients.length === 0) return;
    const first = confirm("Supprimer DÉFINITIVEMENT les " + allClients.length + " clients enregistrés ?\n\nLes colis existants ne sont pas touchés, seule la liste des clients est vidée.");
    if(!first) return;
    const typed = prompt("Pour confirmer, tape exactement : SUPPRIMER");
    if(typed !== "SUPPRIMER") { alert("Suppression annulée."); return; }

    const btn = document.getElementById('deleteAllBtn');
    btn.disabled = true; btn.textContent = "Suppression…";
    try{
      const snap = await db.collection('clients').get();
      const batches = [];
      let batch = db.batch(); let count = 0;
      snap.forEach(doc => {
        batch.delete(doc.ref); count++;
        if(count === 450){ batches.push(batch.commit()); batch = db.batch(); count = 0; }
      });
      if(count > 0) batches.push(batch.commit());
      await Promise.all(batches);
      allClients = [];
      renderKPIs();
      applyFilter();
    }catch(err){
      console.error(err);
      alert("Impossible de tout supprimer. Vérifie les règles Firestore.");
    }finally{
      btn.disabled = false; btn.textContent = "🗑️ Tout supprimer";
    }
  });
</script>

</body>
