<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Vision · Colis</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#0f2142">
<link rel="apple-touch-icon" href="icon-192-interne.png">
<link rel="icon" href="icon-192-interne.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-950:#0a1830; --navy-900:#0f2142; --navy-800:#16305c; --navy-700:#1e3f78;
    --cream:#f6f1e6; --paper:#fffdf8; --gold:#c99a3c; --gold-light:#e6c876;
    --ink:#0f1b2d; --slate:#5c6b83; --slate-light:#93a1b8; --line:#e7e1d2;
    --red-flag:#c8342f; --yellow-flag:#f2b632; --green-flag:#1e7a46; --blue-status:#2b5fb0;
    --error-bg:#fdecec; --error-text:#a32621; --radius:16px;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  html,body{margin:0; background:var(--cream); font-family:'Inter',system-ui,sans-serif; color:var(--ink);}
  a{color:inherit; text-decoration:none;} button{font-family:inherit;}

  header{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line);}
  .flagbar{height:3px; background:linear-gradient(90deg, var(--red-flag) 0 33%, var(--yellow-flag) 33% 66%, var(--green-flag) 66% 100%);}
  .headrow{display:flex; align-items:center; gap:12px; padding:13px 18px;}
  .iconbtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--navy-800); flex:none;}
  .iconbtn:hover{background:var(--cream);}
  .head-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px;}
  .head-sub{font-size:11.5px; color:var(--slate-light);}
  .head-cta{
    margin-left:auto; background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff;
    border:none; border-radius:10px; padding:9px 13px; font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px;
  }

  main{max-width:680px; margin:0 auto; padding:18px 18px 50px;}

  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;}
  .kpi{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:13px 13px 12px 17px; overflow:hidden;}
  .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px;}
  .kpi.total::before{background:var(--navy-800);}
  .kpi.attente::before{background:var(--yellow-flag);}
  .kpi.transit::before{background:var(--blue-status);}
  .kpi.livre::before{background:var(--green-flag);}
  .kpi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--slate); font-weight:600; margin-bottom:6px;}
  .kpi-value{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700;}
  .kpi-value.skeleton{width:36px; height:20px; border-radius:6px; background:linear-gradient(90deg,#eee,#f6f6f6,#eee); background-size:200% 100%; animation:shimmer 1.3s infinite;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  .toolbar{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .search-shell{display:flex; align-items:center; gap:9px; background:var(--paper); border:1.5px solid var(--line); border-radius:11px; padding:0 13px;}
  .search-shell input{flex:1; border:none; outline:none; background:none; padding:12px 0; font-size:14px; font-family:inherit;}
  .filter-row{display:flex; gap:8px;}
  .filter-row select{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 11px; font-size:13.5px; background:var(--paper); font-family:inherit; color:var(--ink);
  }

  .archived-link{font-size:12.5px; color:var(--navy-700); font-weight:600; margin-bottom:14px; display:inline-block;}

  .list-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .list-head h2{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0;}
  .list-head span{font-size:12.5px; color:var(--slate-light);}

  .colis-list{display:flex; flex-direction:column; gap:10px;}
  .colis-card{
    background:var(--paper); border:1px solid var(--line); border-radius:13px; padding:15px 16px; cursor:pointer;
  }
  .colis-card:hover{border-color:var(--navy-700);}
  .cc-top{display:flex; align-items:center; margin-bottom:9px;}
  .cc-track{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; color:var(--navy-800);}
  .status-pill{margin-left:auto; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; display:flex; align-items:center; gap:5px;}
  .status-pill.en_attente{background:#fdf2de; color:#a9780f;}
  .status-pill.en_transit{background:#e9f0fc; color:var(--blue-status);}
  .status-pill.livre{background:#e8f6ee; color:var(--green-flag);}
  .status-pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .cc-dest{font-size:13.5px; font-weight:600; margin-bottom:2px;}
  .cc-addr{font-size:12px; color:var(--slate-light); margin-bottom:10px;}
  .cc-route{font-size:12px; color:var(--slate); margin-bottom:10px;}
  .cc-meta{display:flex; justify-content:space-between; padding-top:9px; border-top:1px dashed var(--line); font-size:12.5px;}
  .cc-meta .m-label{color:var(--slate-light); display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;}
  .cc-meta .m-val{font-weight:600;}

  .empty-state, .error-state{text-align:center; padding:40px 20px; background:var(--paper); border:1px dashed var(--line); border-radius:14px; color:var(--slate);}
  .error-state{border-color:#f3c6c4; background:var(--error-bg); color:var(--error-text); border-style:solid;}
  .empty-state svg, .error-state svg{margin-bottom:10px; color:var(--slate-light);}

  /* MODAL */
  .modal-overlay{position:fixed; inset:0; background:rgba(10,24,48,.5); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--paper); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideUp .25s cubic-bezier(.2,.7,.2,1) both;
  }
  @media (min-width:600px){
    .modal-overlay{align-items:center;}
    .modal{border-radius:18px; max-height:82vh;}
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; margin-bottom:16px;}
  .modal-head .cc-track{font-size:18px;}
  .modal-close{margin-left:auto; background:var(--cream); border:none; width:32px; height:32px; border-radius:9px; cursor:pointer; color:var(--slate); display:flex; align-items:center; justify-content:center;}
  .modal-section{margin-bottom:16px;}
  .modal-section h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--slate-light); margin:0 0 8px;}
  .modal-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .modal-line:last-child{border-bottom:none;}
  .modal-line span:first-child{color:var(--slate);}
  .status-update{display:flex; gap:8px; margin-top:6px;}
  .status-update select{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:11px; font-family:inherit; font-size:14px;}
  .status-update button{
    border:none; border-radius:10px; padding:0 16px; background:linear-gradient(160deg, var(--navy-700), var(--navy-900)); color:#fff; font-weight:600; cursor:pointer;
  }
  .status-update button:disabled{opacity:.6;}
</style>
</head>
<body>

<header>
  <div class="flagbar"></div>
  <div class="headrow">
    <a class="iconbtn" href="dashboard.html" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div>
      <div class="head-title">Colis</div>
      <div class="head-sub" id="headCount">Chargement…</div>
    </div>
    <a class="head-cta" href="nouveau-colis.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Nouveau
    </a>
  </div>
</header>

<main>

  <div class="kpi-grid">
    <div class="kpi total"><div class="kpi-label">Total colis</div><div class="kpi-value skeleton" id="kpiTotal"></div></div>
    <div class="kpi attente"><div class="kpi-label">En attente</div><div class="kpi-value skeleton" id="kpiAttente"></div></div>
    <div class="kpi transit"><div class="kpi-label">En transit</div><div class="kpi-value skeleton" id="kpiTransit"></div></div>
    <div class="kpi livre"><div class="kpi-label">Livrés</div><div class="kpi-value skeleton" id="kpiLivre"></div></div>
  </div>

  <div class="toolbar">
    <div class="search-shell">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Rechercher par numéro de suivi ou destinataire…">
    </div>
    <div class="filter-row">
      <select id="statusFilter">
        <option value="">Tous les statuts</option>
        <option value="en_attente">En attente</option>
        <option value="en_transit">En transit</option>
        <option value="livre">Livré</option>
      </select>
      <select id="sortOrder">
        <option value="desc">Plus récents</option>
        <option value="asc">Plus anciens</option>
      </select>
    </div>
  </div>

  <div class="list-head">
    <h2>Liste des colis</h2>
    <span id="visibleCount"></span>
  </div>

  <div class="colis-list" id="colisList"></div>

</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <span class="cc-track" id="modalTrack">—</span>
      <a id="modalLabelLink" href="#" style="margin-left:auto; font-size:12.5px; font-weight:600; color:var(--navy-700); white-space:nowrap;">🏷️ Étiquette</a>
      <a id="modalReceiptLink" href="#" style="margin-left:10px; margin-right:8px; font-size:12.5px; font-weight:600; color:var(--navy-700); white-space:nowrap;">🧾 Reçu</a>
      <button class="modal-close" id="modalClose" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-section">
      <h4>Statut</h4>
      <div class="status-update">
        <select id="modalStatusSelect">
          <option value="en_attente">En attente</option>
          <option value="en_transit">En transit</option>
          <option value="livre">Livré</option>
        </select>
        <button id="modalStatusSave">Mettre à jour</button>
      </div>
      <div class="modal-line" style="margin-top:10px; border-top:1px solid var(--line); padding-top:10px;">
        <span>Mode d'envoi</span><span id="modalMode">—</span>
      </div>
      <div class="modal-line">
        <span>Trajet</span><span id="modalRoute">—</span>
      </div>
    </div>

    <div class="modal-section">
      <h4>Destinataire</h4>
      <div id="modalDest"></div>
    </div>
    <div class="modal-section">
      <h4>Expéditeur</h4>
      <div id="modalSender"></div>
    </div>
    <div class="modal-section">
      <h4>Produits</h4>
      <div id="modalProducts"></div>
    </div>
    <div class="modal-section">
      <h4>Frais</h4>
      <div id="modalFees"></div>
    </div>
    <div class="modal-section">
      <button id="modalDeleteBtn" style="width:100%; border:1.5px solid #f3c6c4; background:#fff; color:var(--red-flag); border-radius:11px; padding:12px; font-weight:600; font-size:13.5px; cursor:pointer;">🗑️ Supprimer ce colis</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURATION FIREBASE — mêmes clés que sur les autres pages
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDoWCBh3rschFm97Z5Y7ax1bamhadDS42Q",
    authDomain: "africa-vision-3b38f.firebaseapp.com",
    projectId: "africa-vision-3b38f",
    storageBucket: "africa-vision-3b38f.firebasestorage.app",
    messagingSenderId: "233363053035",
    appId: "1:233363053035:web:6a5ef497fbf0991216e1ae"
  };
  const REQUIRE_AUTH = true;
  const LOGIN_URL = "connexion.html";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const fmtGNF = n => new Intl.NumberFormat('fr-FR').format(Math.round(n||0)) + " GNF";
  const statusLabel = c => ({en_attente:'En attente', en_transit:'En transit', livre:'Livré'}[c] || c);
  const fmtDate = ts => {
    if(!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('fr-FR');
  };

  let allDocs = [];   // {id, data}
  let currentDetailId = null;

  let canDeleteColis = false;
  let userProfile = { isDga: true, routeAssignee: null }; // par défaut (compte non listé = DGA)
  async function loadUserProfile(){
    try{
      const snap = await db.collection('utilisateurs').where('email', '==', auth.currentUser.email).limit(1).get();
      if(snap.empty) return { isDga: true, routeAssignee: null }; // compte non listé = DGA par défaut
      const u = snap.docs[0].data();
      const isDga = u.role === 'dga';
      return {
        isDga,
        canDelete: isDga || (u.permissions && u.permissions.supprimerColis === true),
        routeAssignee: (!isDga && u.routeAssignee) ? u.routeAssignee : null
      };
    }catch(e){
      console.warn("Vérification du profil utilisateur impossible", e);
      return { isDga: false, canDelete: false, routeAssignee: null };
    }
  }

  // Un utilisateur sans route assignée (ou DGA) peut gérer tous les colis.
  // Sinon, il faut que départ ET destination du colis correspondent à sa route assignée.
  function canManageColis(colisData){
    if(userProfile.isDga) return true;
    const r = userProfile.routeAssignee;
    if(!r || (!r.depart && !r.arrivee)) return true;
    const route = colisData.route || {};
    const departOk = !r.depart || route.depart === r.depart;
    const arriveeOk = !r.arrivee || route.arrivee === r.arrivee;
    return departOk && arriveeOk;
  }

  auth.onAuthStateChanged(async user => {
    if(user){
      userProfile = await loadUserProfile();
      canDeleteColis = !!userProfile.canDelete;
      loadColis();
    }
    else if(REQUIRE_AUTH){ window.location.href = LOGIN_URL; }
    else { loadColis(); }
  });

  function loadColis(){
    db.collection('colis').get().then(snap => {
      allDocs = snap.docs.map(d => ({id:d.id, data:d.data()}));
      renderKPIs();
      applyFilters();
    }).catch(err => {
      console.error(err);
      document.getElementById('colisList').innerHTML = `
        <div class="error-state">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <p><strong>Impossible de charger les colis.</strong></p>
          <p>Vérifie la configuration Firebase et les règles Firestore.</p>
        </div>`;
      document.getElementById('headCount').textContent = "Erreur de chargement";
    });
  }

  function renderKPIs(){
    const counts = {total:allDocs.length, en_attente:0, en_transit:0, livre:0};
    allDocs.forEach(({data}) => { if(counts[data.statut] !== undefined) counts[data.statut]++; });
    document.getElementById('kpiTotal').textContent = counts.total;
    document.getElementById('kpiAttente').textContent = counts.en_attente;
    document.getElementById('kpiTransit').textContent = counts.en_transit;
    document.getElementById('kpiLivre').textContent = counts.livre;
    document.querySelectorAll('.kpi-value').forEach(el => el.classList.remove('skeleton'));
    document.getElementById('headCount').textContent = counts.total + " colis · Suivi des expéditions";
  }

  function applyFilters(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const statusF = document.getElementById('statusFilter').value;
    const order = document.getElementById('sortOrder').value;

    let list = allDocs.filter(({data}) => {
      const dest = data.destinataire || {};
      const matchesQ = !q ||
        (data.numeroSuivi||'').toLowerCase().includes(q) ||
        (dest.nom||'').toLowerCase().includes(q) ||
        (dest.prenom||'').toLowerCase().includes(q);
      const matchesStatus = !statusF || data.statut === statusF;
      return matchesQ && matchesStatus;
    });

    list.sort((a,b) => {
      const ta = a.data.dateCreation && a.data.dateCreation.toMillis ? a.data.dateCreation.toMillis() : 0;
      const tb = b.data.dateCreation && b.data.dateCreation.toMillis ? b.data.dateCreation.toMillis() : 0;
      return order === 'desc' ? tb-ta : ta-tb;
    });

    renderList(list);
  }

  function renderList(list){
    const container = document.getElementById('colisList');
    document.getElementById('visibleCount').textContent = list.length + " affiché(s)";

    if(list.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <p><strong>Aucun colis ne correspond à ta recherche.</strong></p>
        </div>`;
      return;
    }

    container.innerHTML = '';
    list.forEach(({id, data}) => {
      const dest = data.destinataire || {};
      const route = data.route || {};
      const statut = data.statut || 'en_attente';
      const card = document.createElement('div');
      card.className = 'colis-card';
      card.innerHTML = `
        <div class="cc-top">
          <span class="cc-track">${data.numeroSuivi || id}</span>
          <span class="status-pill ${statut}"><span class="dot"></span>${statusLabel(statut)}</span>
        </div>
        <div class="cc-dest">${[dest.prenom, dest.nom].filter(Boolean).join(' ') || 'Destinataire non renseigné'}</div>
        <div class="cc-addr">${dest.adresse || 'Adresse non renseignée'}</div>
        <div class="cc-route">${route.depart || 'GUINEE'} → ${route.arrivee || '—'}</div>
        <div class="cc-meta">
          <div><span class="m-label">Poids</span><span class="m-val">${(data.poidsTotal||0).toFixed(1)} kg</span></div>
          <div><span class="m-label">Frais</span><span class="m-val">${fmtGNF(data.frais ? data.frais.total : 0)}</span></div>
          <div><span class="m-label">Date</span><span class="m-val">${fmtDate(data.dateCreation)}</span></div>
        </div>
      `;
      card.addEventListener('click', () => openDetail(id, data));
      container.appendChild(card);
    });
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('statusFilter').addEventListener('change', applyFilters);
  document.getElementById('sortOrder').addEventListener('change', applyFilters);

  // ---------------- DETAIL MODAL ----------------
  const modalOverlay = document.getElementById('modalOverlay');
  function openDetail(id, data){
    currentDetailId = id;
    document.getElementById('modalTrack').textContent = data.numeroSuivi || id;
    document.getElementById('modalReceiptLink').href = "recu.html?id=" + id;
    document.getElementById('modalLabelLink').href = "etiquette.html?id=" + id;
    document.getElementById('modalStatusSelect').value = data.statut || 'en_attente';
    document.getElementById('modalMode').textContent = data.mode === 'maritime' ? '🚢 Maritime' : '✈️ Aérien';
    const route = data.route || {};
    document.getElementById('modalRoute').textContent = (route.depart || 'GUINEE') + ' → ' + (route.arrivee || '—');

    const canManage = canManageColis(data);
    document.getElementById('modalStatusSelect').disabled = !canManage;
    document.getElementById('modalStatusSave').disabled = !canManage;
    document.getElementById('modalStatusSave').style.opacity = canManage ? '1' : '0.5';
    document.getElementById('modalDeleteBtn').style.display = (canDeleteColis && canManage) ? '' : 'none';
    let restrictNote = document.getElementById('modalRestrictNote');
    if(!restrictNote){
      restrictNote = document.createElement('div');
      restrictNote.id = 'modalRestrictNote';
      restrictNote.style.cssText = 'font-size:12px; color:var(--slate-light); background:var(--cream); border-radius:8px; padding:8px 10px; margin-top:8px;';
      document.getElementById('modalStatusSave').insertAdjacentElement('afterend', restrictNote);
    }
    restrictNote.style.display = canManage ? 'none' : 'block';
    restrictNote.textContent = "Ce colis est hors de ta route assignée — consultation seule, tu ne peux pas le modifier ni le supprimer.";

    const dest = data.destinataire || {};
    document.getElementById('modalDest').innerHTML = `
      <div class="modal-line"><span>Nom</span><span>${[dest.prenom, dest.nom].filter(Boolean).join(' ') || '—'}</span></div>
      <div class="modal-line"><span>Téléphone</span><span>${dest.telephone || '—'}</span></div>
      <div class="modal-line"><span>Email</span><span>${dest.email || '—'}</span></div>
      <div class="modal-line"><span>Adresse</span><span>${dest.adresse || 'Non renseignée'}</span></div>
    `;
    const sender = data.expediteur || {};
    document.getElementById('modalSender').innerHTML = `
      <div class="modal-line"><span>Nom</span><span>${[sender.prenom, sender.nom].filter(Boolean).join(' ') || '—'}</span></div>
      <div class="modal-line"><span>Téléphone</span><span>${sender.telephone || '—'}</span></div>
      <div class="modal-line"><span>Adresse</span><span>${sender.adresse || 'Non renseignée'}</span></div>
    `;
    const produits = data.produits || [];
    document.getElementById('modalProducts').innerHTML = produits.map(p => `
      <div class="modal-line"><span>x${p.quantite} ${p.nom}</span><span>${(p.quantite*p.poidsUnitaire).toFixed(1)} kg</span></div>
    `).join('') || '<div class="modal-line"><span>Aucun produit</span></div>';
    const frais = data.frais || {};
    document.getElementById('modalFees').innerHTML = `
      <div class="modal-line"><span>Frais de base</span><span>${fmtGNF(frais.fraisBase)}</span></div>
      <div class="modal-line"><span>Rabais</span><span>-${fmtGNF(frais.rabais)}</span></div>
      <div class="modal-line"><span><strong>Total</strong></span><span><strong>${fmtGNF(frais.total)}</strong></span></div>
    `;
    modalOverlay.classList.add('show');
  }
  document.getElementById('modalClose').addEventListener('click', () => modalOverlay.classList.remove('show'));
  modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) modalOverlay.classList.remove('show'); });

  document.getElementById('modalStatusSave').addEventListener('click', async () => {
    if(!currentDetailId) return;
    const target = allDocs.find(d => d.id === currentDetailId);
    if(!target || !canManageColis(target.data)){ alert("Ce colis est hors de ta route assignée."); return; }
    const btn = document.getElementById('modalStatusSave');
    const newStatus = document.getElementById('modalStatusSelect').value;
    btn.disabled = true; btn.textContent = "…";
    try{
      await db.collection('colis').doc(currentDetailId).update({statut: newStatus});
      target.data.statut = newStatus;
      renderKPIs();
      applyFilters();
      modalOverlay.classList.remove('show');
    }catch(err){
      console.error(err);
      alert("Impossible de mettre à jour le statut. Vérifie les règles Firestore.");
    }finally{
      btn.disabled = false; btn.textContent = "Mettre à jour";
    }
  });

  document.getElementById('modalDeleteBtn').addEventListener('click', async () => {
    if(!currentDetailId) return;
    if(!canDeleteColis){ alert("Tu n'as pas la permission de supprimer un colis."); return; }
    const target = allDocs.find(d => d.id === currentDetailId);
    if(!target || !canManageColis(target.data)){ alert("Ce colis est hors de ta route assignée."); return; }
    const track = target ? (target.data.numeroSuivi || currentDetailId) : currentDetailId;
    if(!confirm("Supprimer définitivement le colis " + track + " et tous ses paiements associés ?\n\nCette action est irréversible.")) return;

    const btn = document.getElementById('modalDeleteBtn');
    btn.disabled = true; btn.textContent = "Suppression…";
    try{
      const paySnap = await db.collection('paiements').where('colisId', '==', currentDetailId).get();
      const batch = db.batch();
      paySnap.forEach(doc => batch.delete(doc.ref));
      batch.delete(db.collection('colis').doc(currentDetailId));
      await batch.commit();

      allDocs = allDocs.filter(d => d.id !== currentDetailId);
      renderKPIs();
      applyFilters();
      modalOverlay.classList.remove('show');
    }catch(err){
      console.error(err);
      alert("Impossible de supprimer. Vérifie les règles Firestore.");
    }finally{
      btn.disabled = false; btn.textContent = "🗑️ Supprimer ce colis";
    }
  });
</script>

</body>
</html>
